# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package (Flask app.py) 🐍

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    
    # --- MODIFIED STEP ---
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install testing tools (flake8, pytest) and the Flask package
        python -m pip install flake8 pytest flask
        # Also install pytest-cov for coverage reporting (optional but recommended)
        python -m pip install pytest-cov
        # Install dependencies from requirements.txt if it exists
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    # ---------------------

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    # --- MODIFIED STEP ---
    - name: Test with pytest (including coverage)
      # Assuming your tests are in a 'tests/' directory and use the pytest framework.
      # The pytest command will automatically discover tests.
      run: |
        # Use coverage reporting with pytest
        # The `--cov=.` means report coverage for the current directory/project.
        pytest --cov=. --cov-report=xml
    # ---------------------
